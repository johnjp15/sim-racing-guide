# GitHub Pages: johnjp15/sim-racing-guide -> https://johnjp15.github.io/sim-racing-guide/
site_url: https://johnjp15.github.io/sim-racing-guide/
repo_name: johnjp15/sim-racing-guide
repo_url: https://github.com/johnjp15/sim-racing-guide
edit_uri: edit/main/docs/

site_name: Sim Racing Equipment Guide
site_description: A beginner-friendly wiki for getting into sim racing after F1 Arcade — setups, tiers, components, and example builds.
site_author: TODO

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# NAV / STRUCTURE — edit this one section to reorganise the wiki.
# One topic = one file in docs/. To add, remove, rename, or reorder a page:
#   1. add/remove/rename the .md file in docs/, and
#   2. add/remove/edit its single line here.
# Internal links in pages are relative Markdown links, so update those too when renaming.
nav:
  - Home: index.md
  - Quick Start (Concise):
      - 5-Minute Guide: quick/quick-start.md
      - Equipment Finder: quick/equipment-finder.md
      - Builds at a Glance: quick/builds-at-a-glance.md
  - Draft Guide: draft-guide.md
  - Full Guide:
      - 1. What is Sim Racing?: 01-what-is-sim-racing.md
      - 2. Why Sim Race?: 02-why-sim-race.md
      - 3. Who Is This For?: 03-who-is-this-for.md
      - 4. Where & When Do You Race?: 04-where-and-when.md
      - 5. How It Works — The 5 Pillars: 05-how-it-works.md
      - 6. Types of Setups: 06-types-of-setups.md
      - 9. Buying Smart: 09-buying-smart.md
      - 10. First Setup, Tuning & Games: 10-first-setup-tuning-and-games.md
  - Components:
      - Overview: components/index.md
      - Wheelbases: components/wheelbases.md
      - Pedals: components/pedals.md
      - Wheel Rims: components/wheel-rims.md
      - Shifters & Handbrakes: components/shifters-handbrakes.md
      - Cockpits & Mounting: components/cockpits-mounting.md
      - Displays & VR: components/displays-vr.md
      - PC, Audio & Accessories: components/pc-audio-accessories.md
  - Example Builds:
      - Overview: builds/index.md
      - Tier 0 — Desk Starter: builds/tier-0-desk-starter.md
      - Tier 1 — Foldable / Apartment: builds/tier-1-foldable-apartment.md
      - Tier 2 — First Dedicated Rig: builds/tier-2-first-dedicated-rig.md
      - Tier 3 — Sweet Spot Enthusiast: builds/tier-3-sweet-spot-enthusiast.md
      - Tier 4 — Triples / VR Enthusiast: builds/tier-4-triples-vr-enthusiast.md
      - Tier 5 — Motion / Pro: builds/tier-5-motion-pro.md
  - Glossary: glossary.md
  - FAQ: faq.md
