# GitHub Pages: johnjp15/sim-racing-guide -> https://johnjp15.github.io/sim-racing-guide/
site_url: https://johnjp15.github.io/sim-racing-guide/
repo_name: johnjp15/sim-racing-guide
repo_url: https://github.com/johnjp15/sim-racing-guide
edit_uri: edit/main/docs/

site_name: Sim Racing Equipment Guide
site_description: "A beginner-friendly wiki for getting into sim racing after F1 Arcade: setups, tiers, components, and example builds."
site_author: johnjp15

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# NAV / STRUCTURE, edit this one section to reorganise the wiki.
# One topic = one file in docs/. To add, remove, rename, or reorder a page:
#   1. add/remove/rename the .md file in docs/, and
#   2. add/remove/edit its single line here.
# Internal links in pages are relative Markdown links, so update those too when renaming.
nav:
  - Home: index.md
  - Getting Started:
      - What to Play: start/games.md
      - First Setup: start/first-setup.md
      - Buying Smart: start/buying.md
      - Glossary: start/glossary.md
  - Types of Setups:
      - Intro: builds/index.md
      - "Tier 0: Desk Starter": builds/tier-0-desk-starter.md
      - "Tier 1: Foldable / Apartment": builds/tier-1-foldable-apartment.md
      - "Tier 2: First Dedicated Rig": builds/tier-2-first-dedicated-rig.md
      - "Tier 3: Sweet Spot Enthusiast": builds/tier-3-sweet-spot-enthusiast.md
      - "Tier 4: Triples / VR Enthusiast": builds/tier-4-triples-vr-enthusiast.md
      - "Tier 5: Motion / Pro": builds/tier-5-motion-pro.md
  - Components:
      - Rig Anatomy: components/index.md
      - Chassis & Mounts: components/chassis-mounts.md
      - Seat: components/seating.md
      - Wheelbase: components/wheelbases.md
      - Wheel: components/wheel-rims.md
      - Pedals: components/pedals.md
      - Shifter & Handbrake: components/shifters-handbrakes.md
      - Displays: components/displays-vr.md
      - Button Box & Accessories: components/button-boxes-accessories.md
      - PC / Console: components/pc-console.md
      - Sound: components/audio.md
      - Motion & Immersion: components/immersion.md
  - Draft Guide: draft-guide.md
